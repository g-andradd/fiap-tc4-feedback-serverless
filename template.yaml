AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Plataforma de feedback de aulas. Recursos de suporte de um ambiente.

Parameters:
  Stage:
    Type: String
    Description: Ambiente da stack. Entra como sufixo no nome de todos os recursos.
    AllowedValues:
      - dev
      - hml
      - prod
  EmailAdmin:
    Type: String
    NoEcho: true
    Description: E-mail que assina o tópico de administradores. Vem do secret EMAIL_ADMIN do ambiente no GitHub.
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: precisa ser um endereço de e-mail válido.

Conditions:
  EhProd: !Equals [!Ref Stage, prod]

# As roles de deploy só criam role de função com este boundary, definido em
# infra/bootstrap/github-oidc.yaml. Sem ele, o deploy da primeira função é negado.
Globals:
  Function:
    PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/feedback-limite-funcoes-${Stage}

Resources:
  TabelaAvaliacoes:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub feedback-avaliacoes-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: dataEnvio
          AttributeType: S
        - AttributeName: criadoEm
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: por-data
          KeySchema:
            - AttributeName: dataEnvio
              KeyType: HASH
            - AttributeName: criadoEm
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [EhProd, true, false]

  TopicoAdmins:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub feedback-admins-${Stage}
      KmsMasterKeyId: alias/aws/sns

  AssinaturaEmailAdmin:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref TopicoAdmins
      Protocol: email
      Endpoint: !Ref EmailAdmin

  BucketRelatorios:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub feedback-relatorios-${AWS::AccountId}-${Stage}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PoliticaBucketRelatorios:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketRelatorios
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: NegaAcessoSemTls
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt BucketRelatorios.Arn
              - !Sub ${BucketRelatorios.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  TabelaAvaliacoesNome:
    Description: Nome da tabela de avaliações
    Value: !Ref TabelaAvaliacoes
  TabelaAvaliacoesArn:
    Description: ARN da tabela de avaliações
    Value: !GetAtt TabelaAvaliacoes.Arn
  TabelaAvaliacoesStreamArn:
    Description: ARN do stream da tabela de avaliações
    Value: !GetAtt TabelaAvaliacoes.StreamArn
  TopicoAdminsNome:
    Description: Nome do tópico de administradores
    Value: !GetAtt TopicoAdmins.TopicName
  TopicoAdminsArn:
    Description: ARN do tópico de administradores
    Value: !Ref TopicoAdmins
  BucketRelatoriosNome:
    Description: Nome do bucket de relatórios
    Value: !Ref BucketRelatorios
  BucketRelatoriosArn:
    Description: ARN do bucket de relatórios
    Value: !GetAtt BucketRelatorios.Arn
